<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Byte Buddies — Where kids befriend AI</title>
    <meta
      name="description"
      content="Byte Buddies: short, playful missions that teach kids aged 8–12 how AI really works. Where kids befriend AI."
    />
    <!-- Apply the saved theme before paint (dark-first) to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("techquest.theme.v2");
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!-- Rethink type system: Inter for body, Plus Jakarta Sans for headings. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
